<div class="overlay" id="platform-agreement-modal" style="background: var(--bg-main) !important; z-index: 2500; display: flex; flex-direction: column; width: 100%; height: 100%;">
    <!-- Header with Back Button -->
    <div style="display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border-light); gap: 12px; background: var(--bg-main);">
        <button type="button" onclick="closePlatformAgreementModal()" style="background: none; border: none; font-size: 1.25rem; color: var(--text-primary); cursor: pointer; padding: 4px; display: flex; align-items: center; outline: none;">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </button>
        <h3 id="platform-agreement-title" style="margin: 0; font-size: 1.05rem; font-weight: 800; color: var(--text-primary); flex: 1;">Platform Agreement</h3>
    </div>
    
    <!-- Agreement Content Scroll Area -->
    <div style="flex: 1; overflow-y: auto; padding: 20px; text-align: left; background: var(--bg-main);">
        <div id="platform-agreement-summary" style="display: none; padding: 12px; margin-bottom: 16px; background: rgba(91,81,249,0.08); border-radius: 10px; font-size: 0.82rem; color: var(--text-secondary); line-height: 1.5; border-left: 3px solid var(--primary);"></div>
        <div id="platform-agreement-body" style="font-size: 0.85rem; color: var(--text-secondary); line-height: 1.6; word-wrap: break-word;">
            <!-- Content loaded dynamically via JS -->
        </div>
    </div>
</div>
