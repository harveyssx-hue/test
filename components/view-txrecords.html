<div id="view-txrecords" class="view-tab-content">
                        <div class="sub-header-sticky">
                            <div class="strategy-header-row">
                                <button class="back-text-btn" onclick="closeTxRecordsModal()">
                                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
                                    <span data-i18n="back_btn">Back</span>
                                </button>
                            </div>
                        </div>

                        <div style="padding: 10px 4px 15px;">
                            <div class="modal-header" style="margin-bottom: 15px; padding-left: 5px;">
                                <h2 style="font-size: 1.4rem; font-weight: 800; color: var(--text-primary);" data-i18n="records_header_title">📊 Transaction History</h2>
                                <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px;" data-i18n="records_header_desc">Query all recharge and withdrawal records under this account</p>
                            </div>

                            <!-- Category tabs for records -->
                            <div class="category-tabs-container" style="margin-bottom: 15px; padding: 0 5px;">
                                <div class="category-tabs-flex" style="display: flex; gap: 8px; background: rgba(0,0,0,0.03); padding: 4px; border-radius: 8px;">
                                    <button class="category-tab active" onclick="filterTxRecords('ALL')" style="flex: 1; padding: 8px; border: none; background: none; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.2s;" data-i18n="filter_all">All</button>
                                    <button class="category-tab" onclick="filterTxRecords('DEPOSIT')" style="flex: 1; padding: 8px; border: none; background: none; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.2s;" data-i18n="filter_deposit">Deposit</button>
                                    <button class="category-tab" onclick="filterTxRecords('WITHDRAW')" style="flex: 1; padding: 8px; border: none; background: none; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.2s;" data-i18n="filter_withdraw">Withdraw</button>
                                </div>
                            </div>

                            <div class="notify-list" id="txrecords-items-list" style="margin-top: 5px; min-height: 200px;">
                                <!-- Dynamically loaded -->
                            </div>
                        </div>
                        <div style="height: 70px;"></div>
                    </div>
