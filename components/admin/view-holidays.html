<div class="view-tab-content active" id="view-holidays">
    <div class="glass-panel data-panel" style="padding: 18px;">
        <!-- Unified Filter Panel -->
        <div style="border-bottom: 1.5px solid var(--border-light); padding-bottom: 15px; margin-bottom: 15px;">
            <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap; justify-content: space-between;">
                <!-- Header, Search, Sync Left -->
                <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap; flex: 1;">
                    <div class="data-panel-title" style="font-size: 1.0rem; color: var(--primary); display: flex; align-items: center; gap: 6px; margin-right: 5px; font-weight: bold;">📅 市场假期管理</div>
                    
                    <button class="action-btn btn-approve" onclick="openHolidayModal()" style="background: #5B51F9; color: #FFF; font-size: 0.72rem; padding: 4px 12px; border-radius: 4px; border: none; font-weight: 600; cursor: pointer; height: 28px;">+ 新增假期</button>
                    
                    <!-- Search Input -->
                    <input type="text" id="holiday-search-name" placeholder="搜索假期名称..." oninput="debounceHolidaysLoad()" style="height: 28px; font-size: 0.75rem; padding: 0 10px; border-radius: 4px; border: 1px solid var(--border-light); outline: none; background: var(--bg-screen); color: var(--text-primary); width: 140px;">
                    
                    <!-- Date Pickers -->
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <input type="date" id="holiday-search-start" onchange="window.adminPages.holidays.current=1; loadHolidaysList()" style="height: 28px; font-size: 0.72rem; padding: 0 5px; border-radius: 4px; border: 1px solid var(--border-light); outline: none; background: var(--bg-screen); color: var(--text-primary);">
                        <span style="font-size: 0.72rem; color: var(--text-muted);">至</span>
                        <input type="date" id="holiday-search-end" onchange="window.adminPages.holidays.current=1; loadHolidaysList()" style="height: 28px; font-size: 0.72rem; padding: 0 5px; border-radius: 4px; border: 1px solid var(--border-light); outline: none; background: var(--bg-screen); color: var(--text-primary);">
                    </div>

                    <!-- Reset Filters Button -->
                    <button class="action-btn" onclick="resetHolidayFilters()" style="background: transparent; border: 1px solid var(--border-light); color: var(--text-secondary); font-size: 0.72rem; padding: 4px 8px; border-radius: 4px; height: 28px; cursor: pointer;">重置</button>

                    <!-- Sync Tool -->
                    <div style="display: flex; align-items: center; gap: 6px; border-left: 1.5px solid var(--border-light); padding-left: 15px; margin-left: 5px;">
                        <select id="sync-holiday-region" class="filter-select" style="height: 28px; font-size: 0.72rem; border-radius: 4px; border: 1px solid var(--border-light); padding: 0 5px; background: transparent; color: var(--text-secondary); outline: none; cursor: pointer; font-weight: 600;">
                            <option value="US">美国市场 (US)</option>
                            <option value="HK">香港市场 (HK)</option>
                            <option value="CN">中国 A 股 (CN)</option>
                            <option value="IN">印度市场 (IN)</option>
                        </select>
                        <button class="action-btn" id="btn-sync-holidays" onclick="syncHolidaysSubmit()" style="background: #10B981; color: #FFF; font-size: 0.72rem; padding: 4px 12px; border-radius: 4px; border: none; font-weight: 600; cursor: pointer; height: 28px; display: flex; align-items: center; gap: 4px;">
                            ⚡ 同步假期
                        </button>
                    </div>
                </div>
                
                <!-- Pagination Controls Right -->
                <div style="display: flex; gap: 6px; align-items: center; background: rgba(255, 255, 255, 0.05); padding: 2px 8px; border-radius: 6px; border: 1.5px solid var(--border-light);">
                    <select class="filter-select" id="holidays-size-select" onchange="changeAdminPageSize('holidays', this.value)" style="height: 24px; font-size: 0.7rem; border-radius: 4px; border: 1px solid var(--border-light); padding: 0 2px; width: 85px; background: transparent; color: var(--text-primary); font-weight: 600; cursor: pointer; outline: none; margin-right: 5px;">
                        <option value="5">5 条/页</option>
                        <option value="10" selected>10 条/页</option>
                        <option value="20">20 条/页</option>
                    </select>
                    <button class="action-btn" onclick="changeAdminPage('holidays', -1)" style="background: var(--primary); color: #FFF; font-size: 0.72rem; padding: 3px 8px; border-radius: 4px; border: none; font-weight: 600; cursor: pointer; height: 24px;">上一页</button>
                    <span id="holidays-page-indicator" style="font-size: 0.72rem; font-weight: 600; color: var(--text-primary); margin: 0 4px; white-space: nowrap;">第 1 / 1 页 (共 0 条)</span>
                    <button class="action-btn" onclick="changeAdminPage('holidays', 1)" style="background: var(--primary); color: #FFF; font-size: 0.72rem; padding: 3px 8px; border-radius: 4px; border: none; font-weight: 600; cursor: pointer; height: 24px;">下一页</button>
                </div>
            </div>
        </div>

        <!-- Table Grid -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 100px;">序号 ID</th>
                        <th>假期名称</th>
                        <th>假期日期</th>
                        <th>创建时间</th>
                        <th>更新时间</th>
                        <th style="width: 150px; text-align: center;">操作选项</th>
                    </tr>
                </thead>
                <tbody id="holidays-table-body">
                    <!-- Dynamically loaded -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Form Dialog -->
<div id="holiday-form-modal" class="overlay" style="display: none; align-items: center; justify-content: center; z-index: 9999; backdrop-filter: blur(10px); background: rgba(0,0,0,0.55);">
    <div class="glass-panel" style="width: 90%; max-width: 420px; padding: 24px; border-radius: 12px; position: relative;">
        <button style="position: absolute; top: 12px; right: 12px; background: transparent; border: none; font-size: 1.2rem; color: var(--text-secondary); cursor: pointer;" onclick="closeHolidayModal()">✕</button>
        
        <h3 id="holiday-modal-title" style="margin-top: 0; margin-bottom: 20px; color: var(--text-primary); display: flex; align-items: center; gap: 8px;">📝 新增假期配置</h3>
        
        <form id="holiday-form" onsubmit="saveHolidaySubmit(event)" style="display: flex; flex-direction: column; gap: 15px;">
            <input type="hidden" id="holiday-id">
            
            <div class="auth-input-group">
                <label style="font-weight: 700; font-size: 0.75rem; color: var(--primary); margin-bottom: 6px; display: block;">假期名称 (Holiday Name) *</label>
                <input type="text" id="holiday-name" required placeholder="例如：圣诞节、元旦、Independence Day" style="width: 100%; height: 38px; border: 1.5px solid var(--border-light); border-radius: 6px; padding: 0 12px; font-size: 0.85rem; outline: none; background: var(--bg-screen); color: var(--text-primary);">
            </div>
            
            <div class="auth-input-group">
                <label style="font-weight: 700; font-size: 0.75rem; color: var(--primary); margin-bottom: 6px; display: block;">假期日期 (Holiday Date) *</label>
                <input type="date" id="holiday-date" required style="width: 100%; height: 38px; border: 1.5px solid var(--border-light); border-radius: 6px; padding: 0 12px; font-size: 0.85rem; outline: none; background: var(--bg-screen); color: var(--text-primary);">
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 10px; justify-content: flex-end;">
                <button type="button" class="action-btn" onclick="closeHolidayModal()" style="background: transparent; border: 1px solid var(--border-light); color: var(--text-secondary); padding: 8px 16px; border-radius: 6px; cursor: pointer;">取消</button>
                <button type="submit" class="action-btn btn-approve" id="holiday-submit-btn" style="background: var(--primary); color: #FFF; border: none; padding: 8px 20px; border-radius: 6px; font-weight: 600; cursor: pointer;">提交保存</button>
            </div>
        </form>
    </div>
</div>
