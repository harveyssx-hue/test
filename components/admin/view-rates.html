            <div class="view-tab-content active" id="view-rates">
                <div class="glass-panel data-panel" style="padding: 18px;">
                    <div style="border-bottom: 1.5px solid var(--border-light); padding-bottom: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                        <div class="data-panel-title" style="font-size: 1.1rem; color: var(--primary); display: flex; align-items: center; gap: 6px;">🪙 平台资产结算汇率管理</div>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <!-- Pagination Controls Right -->
                            <div style="display: flex; gap: 6px; align-items: center; background: rgba(255, 255, 255, 0.05); padding: 2px 8px; border-radius: 6px; border: 1.5px solid var(--border-light);">
                                <select class="filter-select" id="rates-size-select" onchange="changeAdminPageSize('rates', this.value)" style="height: 24px; font-size: 0.7rem; border-radius: 4px; border: 1px solid var(--border-light); padding: 0 2px; width: 85px; background: transparent; color: var(--text-primary); font-weight: 600; cursor: pointer; outline: none; margin-right: 5px;">
                                    <option value="10" selected>10 条/页</option>
                                    <option value="30">30 条/页</option>
                                    <option value="50">50 条/页</option>
                                    <option value="100">100 条/页</option>
                                </select>
                                <button class="action-btn" onclick="changeAdminPage('rates', -1)" style="background: var(--primary); color: #FFF; font-size: 0.72rem; padding: 3px 8px; border-radius: 4px; border: none; font-weight: 600; cursor: pointer; height: 24px;">上一页</button>
                                <span id="rates-page-indicator" style="font-size: 0.72rem; font-weight: 600; color: var(--text-primary); margin: 0 4px; white-space: nowrap;">第 1 / 1 页 (共 0 条)</span>
                                <button class="action-btn" onclick="changeAdminPage('rates', 1)" style="background: var(--primary); color: #FFF; font-size: 0.72rem; padding: 3px 8px; border-radius: 4px; border: none; font-weight: 600; cursor: pointer; height: 24px;">下一页</button>
                            </div>
                            <button class="action-btn btn-approve" onclick="openRateEditModal(null)" style="padding: 6px 14px; font-size: 0.85rem; border-radius: 6px; cursor: pointer; font-weight: 600; background: #5B51F9; border: none; color: #FFF;">+ 新增结算汇率</button>
                        </div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>汇率 ID</th>
                                    <th>基准资产 (Base Asset)</th>
                                    <th>目标资产 (Quote Asset)</th>
                                    <th>兑换汇率 (Exchange Rate)</th>
                                    <th>状态</th>
                                    <th>备注说明</th>
                                    <th>操作选项</th>
                                </tr>
                            </thead>
                            <tbody id="rates-table-body">
                                <!-- Loaded dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

    <!-- EXCHANGE RATE EDIT MODAL -->
    <div class="overlay" id="rate-edit-modal">
        <div class="glass-panel modal-content-payment" style="max-width: 480px;">
            <button class="drawer-close-btn" onclick="closeRateEditModal()" style="top: 24px; right: 24px; font-size: 1.2rem;">✕</button>
            <div class="modal-header-admin" style="margin-bottom: 24px; border-bottom: 1px solid #F1F5F9; padding-bottom: 16px;">
                <h2 style="font-size: 1.35rem; display: flex; align-items: center; gap: 8px; color: var(--text-primary);" id="rate-modal-title">🪙 配置结算汇率</h2>
                <p style="font-size: 0.78rem; color: #64748B; margin-top: 6px; font-weight: 500;">设定与修改不同资产兑换 INR 法币的官方清算和计价汇率</p>
            </div>
            
            <form class="auth-form" onsubmit="submitRateChanges(event)">
                <input type="hidden" id="rate-edit-id">
                
                <div class="auth-input-group" style="margin-bottom: 16px;">
                    <label>基准资产 (Base Asset)</label>
                    <select id="rate-edit-baseAssetId" required class="payment-add-select" onchange="toggleCustomAssetId('base')">
                        <option value="1183348576672026624">USDT (USDT to INR)</option>
                        <option value="1126151490264633373">HKD (HKD to INR)</option>
                        <option value="1126151490264633349">USD (USD to INR)</option>
                        <option value="1126151490264633358">EUR (EUR to INR)</option>
                        <option value="1183348576642666496">BTC (BTC to INR)</option>
                        <option value="1183348576630083584">ETH (ETH to INR)</option>
                        <option value="CUSTOM">--- 输入自定义资产 ID ---</option>
                    </select>
                    <input type="text" id="rate-edit-baseAssetId-custom" class="auth-form input" placeholder="请输入自定义基准资产 ID" style="display: none; margin-top: 8px; width: 100%; box-sizing: border-box; padding: 10px; border-radius: 6px; border: 1px solid #E2E8F0;">
                </div>
                
                <div class="auth-input-group" style="margin-bottom: 16px;">
                    <label>目标结算货币 (Quote Asset)</label>
                    <select id="rate-edit-quoteAssetId" required class="payment-add-select" onchange="toggleCustomAssetId('quote')">
                        <option value="1126151490264633456">INR (卢比法币本位)</option>
                        <option value="CUSTOM">--- 输入自定义资产 ID ---</option>
                    </select>
                    <input type="text" id="rate-edit-quoteAssetId-custom" class="auth-form input" placeholder="请输入自定义目标货币 ID" style="display: none; margin-top: 8px; width: 100%; box-sizing: border-box; padding: 10px; border-radius: 6px; border: 1px solid #E2E8F0;">
                </div>
                
                <div class="auth-input-group" style="margin-bottom: 16px;">
                    <label>官方清算汇率 (Exchange Rate)</label>
                    <input type="number" step="0.0001" id="rate-edit-rate" required placeholder="请输入实时汇率值">
                </div>
                
                <div class="auth-input-group" style="margin-bottom: 16px;">
                    <label>状态</label>
                    <select id="rate-edit-enabled" required class="payment-add-select">
                        <option value="true">启用 (ENABLED)</option>
                        <option value="false">禁用 (DISABLED)</option>
                    </select>
                </div>
                
                <div class="auth-input-group" style="width: 100%; margin-bottom: 16px;">
                    <label>汇率备注说明</label>
                    <textarea id="rate-edit-remark" placeholder="例如: USDT to INR rate" style="height: 60px; resize: none;"></textarea>
                </div>
                
                <button type="submit" class="admin-auth-btn" style="margin-top: 8px; height: 46px; border-radius: 10px; font-weight: 700; letter-spacing: 0.5px;" id="rate-modal-submit-btn">确认并提交配置</button>
            </form>
        </div>
    </div>
