<div class="view-tab-content active" id="view-error-reports">
    <div class="glass-panel data-panel" style="padding: 18px;">
        <!-- Unified Filter Panel -->
        <div style="border-bottom: 1.5px solid var(--border-light); padding-bottom: 15px; margin-bottom: 15px;">
            <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap; justify-content: space-between;">
                <!-- Header, Filters Left -->
                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap; flex: 1;">
                    <div class="data-panel-title" style="font-size: 1.0rem; color: var(--primary); display: flex; align-items: center; gap: 6px; margin-right: 5px; font-weight: bold;">🐞 客户端错误上报记录</div>
                    
                    <!-- User ID Filter -->
                    <input type="text" id="error-search-uid" placeholder="用户 ID..." oninput="debounceErrorReportsLoad()" style="height: 28px; font-size: 0.72rem; padding: 0 10px; border-radius: 4px; border: 1px solid var(--border-light); outline: none; background: var(--bg-screen); color: var(--text-primary); width: 100px;">
                    
                    <!-- Device ID Filter -->
                    <input type="text" id="error-search-device" placeholder="设备 ID..." oninput="debounceErrorReportsLoad()" style="height: 28px; font-size: 0.72rem; padding: 0 10px; border-radius: 4px; border: 1px solid var(--border-light); outline: none; background: var(--bg-screen); color: var(--text-primary); width: 110px;">
                    
                    <!-- APP Version Filter -->
                    <input type="text" id="error-search-version" placeholder="APP 版本..." oninput="debounceErrorReportsLoad()" style="height: 28px; font-size: 0.72rem; padding: 0 10px; border-radius: 4px; border: 1px solid var(--border-light); outline: none; background: var(--bg-screen); color: var(--text-primary); width: 90px;">
                    
                    <!-- OS Platform Filter -->
                    <select id="error-filter-os" onchange="window.adminPages.errorReports.current=1; loadErrorReportsList()" class="filter-select" style="height: 28px; font-size: 0.72rem; border-radius: 4px; border: 1px solid var(--border-light); padding: 0 5px; background: transparent; color: var(--text-secondary); outline: none; cursor: pointer; font-weight: 600;">
                        <option value="">所有系统 (OS)</option>
                        <option value="iOS">iOS</option>
                        <option value="Android">Android</option>
                        <option value="HarmonyOS">HarmonyOS</option>
                        <option value="Web">Web</option>
                    </select>
                    
                    <!-- Reset Filters Button -->
                    <button class="action-btn" onclick="resetErrorReportFilters()" style="background: transparent; border: 1px solid var(--border-light); color: var(--text-secondary); font-size: 0.72rem; padding: 4px 8px; border-radius: 4px; height: 28px; cursor: pointer;">重置</button>
                </div>
                
                <!-- Pagination Controls Right -->
                <div style="display: flex; gap: 6px; align-items: center; background: rgba(255, 255, 255, 0.05); padding: 2px 8px; border-radius: 6px; border: 1.5px solid var(--border-light);">
                    <select class="filter-select" id="errorReports-size-select" onchange="changeAdminPageSize('errorReports', this.value)" style="height: 24px; font-size: 0.7rem; border-radius: 4px; border: 1px solid var(--border-light); padding: 0 2px; width: 85px; background: transparent; color: var(--text-primary); font-weight: 600; cursor: pointer; outline: none; margin-right: 5px;">
                        <option value="5">5 条/页</option>
                        <option value="10" selected>10 条/页</option>
                        <option value="20">20 条/页</option>
                    </select>
                    <button class="action-btn" onclick="changeAdminPage('errorReports', -1)" style="background: var(--primary); color: #FFF; font-size: 0.72rem; padding: 3px 8px; border-radius: 4px; border: none; font-weight: 600; cursor: pointer; height: 24px;">上一页</button>
                    <span id="error-reports-page-indicator" style="font-size: 0.72rem; font-weight: 600; color: var(--text-primary); margin: 0 4px; white-space: nowrap;">第 1 / 1 页 (共 0 条)</span>
                    <button class="action-btn" onclick="changeAdminPage('errorReports', 1)" style="background: var(--primary); color: #FFF; font-size: 0.72rem; padding: 3px 8px; border-radius: 4px; border: none; font-weight: 600; cursor: pointer; height: 24px;">下一页</button>
                </div>
            </div>
        </div>

        <!-- Table Grid -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 80px;">序号 ID</th>
                        <th>用户 / APP版本</th>
                        <th>触发页面</th>
                        <th>平台系统 / 设备</th>
                        <th>错误信息简述 / 错误码</th>
                        <th>发生时间</th>
                        <th style="text-align: center; width: 120px;">操作选项</th>
                    </tr>
                </thead>
                <tbody id="error-reports-table-body">
                    <!-- Dynamically loaded -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal: Error Report Detail View Drawer -->
<div id="error-detail-modal" class="overlay" style="display: none; align-items: center; justify-content: center; z-index: 9999; backdrop-filter: blur(10px); background: rgba(0,0,0,0.55);">
    <div class="glass-panel" style="width: 95%; max-width: 720px; max-height: 85vh; padding: 24px; border-radius: 12px; position: relative; overflow-y: auto; display: flex; flex-direction: column;">
        <button style="position: absolute; top: 12px; right: 12px; background: transparent; border: none; font-size: 1.2rem; color: var(--text-secondary); cursor: pointer; z-index: 100;" onclick="closeErrorReportDetail()">✕</button>
        
        <h3 style="margin-top: 0; margin-bottom: 20px; color: var(--text-primary); display: flex; align-items: center; gap: 8px; border-bottom: 1.5px solid var(--border-light); padding-bottom: 10px;">
            🐞 错误上报详情 (ID: <span id="detail-error-id">--</span>)
        </h3>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;">
            <div style="font-size: 0.78rem; line-height: 1.6; color: var(--text-secondary);">
                • 上报用户: <b style="color: var(--text-primary);" id="detail-error-uid">--</b><br>
                • 触发页面: <b style="color: var(--text-primary);" id="detail-error-page">--</b><br>
                • 运行平台: <b style="color: var(--text-primary);" id="detail-error-os">--</b>
            </div>
            <div style="font-size: 0.78rem; line-height: 1.6; color: var(--text-secondary);">
                • 物理设备: <b style="color: var(--text-primary);" id="detail-error-device">--</b><br>
                • 发生时间: <b style="color: var(--text-primary);" id="detail-error-time">--</b><br>
                • 错误编码: <b style="color: #EF4444; font-family: monospace; font-weight: 700;" id="detail-error-code">--</b>
            </div>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="font-weight: 700; font-size: 0.75rem; color: var(--primary); margin-bottom: 6px; display: block;">错误描述 (Message)</label>
            <div id="detail-error-message" style="background: rgba(239, 68, 68, 0.05); border: 1px solid rgba(239, 68, 68, 0.15); color: #EF4444; padding: 10px 14px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; word-break: break-all;">
                --
            </div>
        </div>

        <div style="margin-bottom: 15px; flex: 1; display: flex; flex-direction: column; min-height: 150px;">
            <label style="font-weight: 700; font-size: 0.75rem; color: var(--primary); margin-bottom: 6px; display: block;">堆栈追踪 (Stack Trace)</label>
            <pre id="detail-error-stack" style="background: #1E293B; color: #38BDF8; font-family: 'Consolas', monospace; padding: 12px 16px; border-radius: 6px; font-size: 0.72rem; overflow: auto; flex: 1; max-height: 250px; margin: 0; line-height: 1.4; word-break: break-all; white-space: pre-wrap;">
--
            </pre>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="font-weight: 700; font-size: 0.75rem; color: var(--primary); margin-bottom: 6px; display: block;">客户端环境变量上下文 (Extra Context)</label>
            <pre id="detail-error-extra" style="background: #0F172A; color: #10B981; font-family: 'Consolas', monospace; padding: 10px 14px; border-radius: 6px; font-size: 0.72rem; overflow: auto; max-height: 120px; margin: 0; white-space: pre-wrap; line-height: 1.3;">
{}
            </pre>
        </div>

        <div style="margin-bottom: 15px; border-top: 1px solid var(--border-light); padding-top: 12px;">
            <label style="font-weight: 700; font-size: 0.75rem; color: var(--primary); margin-bottom: 6px; display: block;">日志附件与屏幕截图</label>
            <div id="detail-error-attachments" style="display: flex; gap: 15px; flex-wrap: wrap;">
                无附件
            </div>
        </div>

        <div style="display: flex; justify-content: flex-end; margin-top: 10px;">
            <button class="action-btn btn-approve" style="background: var(--primary); color: #FFF; border: none; padding: 8px 24px; border-radius: 6px; font-weight: 600; cursor: pointer;" onclick="closeErrorReportDetail()">关闭窗口</button>
        </div>
    </div>
</div>

<script>
    // Local debounce helper for search filtering inside template
    window.errorDebounceTimer = null;
    window.debounceErrorReportsLoad = function() {
        clearTimeout(window.errorDebounceTimer);
        window.errorDebounceTimer = setTimeout(() => {
            window.adminPages.errorReports.current = 1;
            window.loadErrorReportsList();
        }, 450);
    }
</script>
