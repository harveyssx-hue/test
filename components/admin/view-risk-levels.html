<div class="view-tab-content active" id="view-risk-levels">
    <div class="glass-panel data-panel" style="padding: 18px;">
        <!-- Unified Filter Panel -->
        <div style="border-bottom: 1.5px solid var(--border-light); padding-bottom: 15px; margin-bottom: 15px;">
            <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap; justify-content: space-between;">
                <!-- Header and Add Button Left -->
                <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap; flex: 1;">
                    <div class="data-panel-title" style="font-size: 1.0rem; color: var(--primary); display: flex; align-items: center; gap: 6px; margin-right: 10px; font-weight: bold;">🛡️ 用户风控层级管理</div>
                    <button class="action-btn btn-approve" onclick="openRiskLevelModal()" style="background: #5B51F9; color: #FFF; font-size: 0.72rem; padding: 4px 12px; border-radius: 4px; border: none; font-weight: 600; cursor: pointer; height: 28px;">+ 新增风控层级</button>
                </div>
                
                <!-- Pagination Controls Right -->
                <div style="display: flex; gap: 6px; align-items: center; background: rgba(255, 255, 255, 0.05); padding: 2px 8px; border-radius: 6px; border: 1.5px solid var(--border-light);">
                    <select class="filter-select" id="riskLevels-size-select" onchange="changeAdminPageSize('riskLevels', this.value)" style="height: 24px; font-size: 0.7rem; border-radius: 4px; border: 1px solid var(--border-light); padding: 0 2px; width: 85px; background: transparent; color: var(--text-primary); font-weight: 600; cursor: pointer; outline: none; margin-right: 5px;">
                        <option value="5">5 条/页</option>
                        <option value="10" selected>10 条/页</option>
                        <option value="20">20 条/页</option>
                    </select>
                    <button class="action-btn" onclick="changeAdminPage('riskLevels', -1)" style="background: var(--primary); color: #FFF; font-size: 0.72rem; padding: 3px 8px; border-radius: 4px; border: none; font-weight: 600; cursor: pointer; height: 24px;">上一页</button>
                    <span id="riskLevels-page-indicator" style="font-size: 0.72rem; font-weight: 600; color: var(--text-primary); margin: 0 4px; white-space: nowrap;">第 1 / 1 页 (共 0 条)</span>
                    <button class="action-btn" onclick="changeAdminPage('riskLevels', 1)" style="background: var(--primary); color: #FFF; font-size: 0.72rem; padding: 3px 8px; border-radius: 4px; border: none; font-weight: 600; cursor: pointer; height: 24px;">下一页</button>
                </div>
            </div>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>层级 ID</th>
                        <th>层级名称</th>
                        <th>标识代码</th>
                        <th>充值限额</th>
                        <th>提现限额</th>
                        <th>提现需审核</th>
                        <th>备注描述</th>
                        <th>启用状态</th>
                        <th style="text-align: center;">操作选项</th>
                    </tr>
                </thead>
                <tbody id="risk-levels-table-body">
                    <!-- Loaded dynamically -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- VIEW: RISK LEVEL CREATION/EDIT MODAL -->
<div class="overlay" id="risk-level-modal">
    <div class="glass-panel modal-content-payment" style="max-width: 480px; padding: 30px;">
        <button class="drawer-close-btn" onclick="closeRiskLevelModal()" style="top: 24px; right: 24px; font-size: 1.2rem; color: var(--text-secondary); background: transparent; border: none; cursor: pointer;">✕</button>
        <div class="modal-header-admin" style="margin-bottom: 24px; border-bottom: 1px solid #F1F5F9; padding-bottom: 16px;">
            <h2 style="font-size: 1.35rem; display: flex; align-items: center; gap: 8px; color: var(--text-primary); margin: 0;" id="risk-level-modal-title">🛡️ 风控层级配置</h2>
            <p style="font-size: 0.78rem; color: #64748B; margin-top: 6px; font-weight: 500; margin-bottom: 0;">配置交易员的风控限制，控制充值、提现限额及审核要求</p>
        </div>
        
        <form class="auth-form" onsubmit="submitRiskLevelForm(event)">
            <input type="hidden" id="risk-level-edit-id">
            
            <div class="form-grid-2" style="margin-bottom: 15px;">
                <div class="auth-input-group">
                    <label>层级名称</label>
                    <input type="text" id="risk-level-name" required placeholder="如: 低风险等级">
                </div>
                <div class="auth-input-group">
                    <label>层级级别 (Level)</label>
                    <input type="number" min="0" id="risk-level-code" required placeholder="请输入数字，越大层级越高">
                </div>
            </div>

            <div class="form-grid-2" style="margin-bottom: 15px;">
                <div class="auth-input-group">
                    <label>充值限额</label>
                    <input type="number" step="0.01" min="0" id="risk-level-depositLimit" required placeholder="0表示不限额">
                </div>
                <div class="auth-input-group">
                    <label>提现限额</label>
                    <input type="number" step="0.01" min="0" id="risk-level-withdrawLimit" required placeholder="0表示不限额">
                </div>
            </div>
            
            <div class="auth-input-group" style="margin-bottom: 15px;">
                <label>提现人工审核 (Need Audit)</label>
                <select id="risk-level-needAudit" required class="payment-add-select">
                    <option value="true">需要人工审核 (TRUE)</option>
                    <option value="false">免审核直接放款 (FALSE)</option>
                </select>
            </div>
            
            <div class="auth-input-group" style="width: 100%; margin-bottom: 20px;">
                <label>备注说明 (Remark)</label>
                <textarea id="risk-level-remark" placeholder="该风控等级的适用规则或业务背景" style="height: 70px; resize: none; box-sizing: border-box;"></textarea>
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button type="button" class="action-btn" style="flex: 1; background: rgba(0,0,0,0.05); color: var(--text-primary); height: 42px; border: 1.5px solid var(--border-light); cursor: pointer; border-radius: 8px;" onclick="closeRiskLevelModal()">取消</button>
                <button type="submit" class="action-btn" style="flex: 1.5; background: var(--primary); color: #FFF; height: 42px; border: none; cursor: pointer; border-radius: 8px; font-weight: bold;">保存配置</button>
            </div>
        </form>
    </div>
</div>
