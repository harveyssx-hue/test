<div class="view-tab-content active" id="view-tenant-settings">
    <div class="glass-panel data-panel" style="padding: 18px;">
        <!-- Unified Title Header -->
        <div class="data-panel-header" style="margin-bottom: 15px;">
            <div class="data-panel-title" style="font-size: 1.0rem; color: var(--primary); display: flex; align-items: center; gap: 6px; font-weight: bold; margin: 0;">⚙️ 平台系统与租户设置 (Tenant Settings)</div>
            <div style="font-size: 0.85rem; color: var(--text-secondary); display: flex; align-items: center; gap: 8px;">
                <span>当前租户系统 ID:</span>
                <strong id="setting-tenant-id" style="color: var(--primary); font-family: monospace; font-size: 0.88rem;">--</strong>
            </div>
        </div>
        
        <div id="tenant-settings-loader" style="text-align: center; color: var(--text-secondary); padding: 40px 0; font-size: 0.9rem;">
            🔄 正在载入平台租户设置参数...
        </div>
        
        <form id="tenant-settings-form" style="display: none; flex-direction: column; gap: 20px;" onsubmit="submitTenantSettings(event)">
            <div class="table-container" style="border: 1px solid var(--border-light); border-radius: 10px; overflow: auto; background: rgba(255, 255, 255, 0.2); max-height: 70vh; margin-bottom: 10px;">
                <table style="min-width: 900px; border-collapse: collapse;">
                    <thead>
                        <tr style="border-bottom: 1.5px solid var(--border-light); background: rgba(255,255,255,0.4);">
                            <th style="width: 250px; font-weight: 700;">参数项 / 系统键名 (Key)</th>
                            <th style="width: 280px; font-weight: 700;">配置数值 (Value)</th>
                            <th style="font-weight: 700;">参数定义与业务场景说明</th>
                        </tr>
                    </thead>
                    <tbody id="tenant-settings-tbody">
                        <!-- Dynamically populated from system.js -->
                    </tbody>
                </table>
            </div>
            
            <div style="text-align: right; margin-top: 10px;">
                <button type="submit" class="admin-auth-btn" style="min-width: 260px; height: 44px; border-radius: 8px; font-weight: 700; letter-spacing: 0.5px; padding: 0 24px;">✓ 保存并批量更新租户系统设置</button>
            </div>
        </form>
    </div>
</div>
