            <div class="view-tab-content active" id="view-instruments">
                <div class="glass-panel data-panel" style="padding: 18px;">
                    <!-- Unified Filter Panel -->
                    <div style="border-bottom: 1.5px solid var(--border-light); padding-bottom: 15px; margin-bottom: 15px;">
                        <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap; justify-content: space-between;">
                            <!-- Header and Add Button Left -->
                            <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap; flex: 1;">
                                <div class="data-panel-title" style="font-size: 1.0rem; color: var(--primary); display: flex; align-items: center; gap: 6px; margin-right: 10px; font-weight: bold;">📊 交易商品管理</div>
                                <button class="action-btn btn-approve" onclick="openInstrumentDrawer()" style="background: #5B51F9; color: #FFF; font-size: 0.72rem; padding: 4px 12px; border-radius: 4px; border: none; font-weight: 600; cursor: pointer; height: 28px;">+ 新增交易商品</button>
                                
                                <!-- Keyword Input -->
                                <input type="text" id="instruments-search-input" placeholder="搜索 Symbol 或名称..." oninput="debounceInstrumentsLoad()" style="height: 28px; font-size: 0.75rem; padding: 0 10px; border-radius: 4px; border: 1px solid var(--border-light); outline: none; background: var(--bg-screen); color: var(--text-primary); width: 160px;">
                                
                                <!-- Asset Class Filter -->
                                <select id="instruments-asset-class-filter" onchange="loadInstrumentsList()" class="filter-select" style="height: 28px; font-size: 0.75rem; border-radius: 4px; border: 1px solid var(--border-light); padding: 0 5px; background: transparent; color: var(--text-secondary); outline: none; cursor: pointer;">
                                    <option value="">所有资产类别 (All)</option>
                                    <option value="CRYPTO">加密货币 (CRYPTO)</option>
                                    <option value="FIAT">法币 (FIAT)</option>
                                    <option value="STOCK">股票 (STOCK)</option>
                                    <option value="FUTURES">期货 (FUTURES)</option>
                                    <option value="COMMODITY">商品 (COMMODITY)</option>
                                    <option value="OPTION">期权 (OPTION)</option>
                                    <option value="FOREX">外汇 (FOREX)</option>
                                    <option value="INDICES">指数 (INDICES)</option>
                                </select>

                                <!-- Core status filter -->
                                <select id="instruments-core-filter" onchange="loadInstrumentsList()" class="filter-select" style="height: 28px; font-size: 0.75rem; border-radius: 4px; border: 1px solid var(--border-light); padding: 0 5px; background: transparent; color: var(--text-secondary); outline: none; cursor: pointer;">
                                    <option value="">核心状态 (All)</option>
                                    <option value="true">仅核心商品 (Core)</option>
                                    <option value="false">非核心商品 (Non-Core)</option>
                                </select>

                                <!-- Recommended status filter -->
                                <select id="instruments-recommended-filter" onchange="loadInstrumentsList()" class="filter-select" style="height: 28px; font-size: 0.75rem; border-radius: 4px; border: 1px solid var(--border-light); padding: 0 5px; background: transparent; color: var(--text-secondary); outline: none; cursor: pointer;">
                                    <option value="">推荐状态 (All)</option>
                                    <option value="true">仅推荐商品 (Rec)</option>
                                    <option value="false">非推荐商品 (Non-Rec)</option>
                                </select>

                                <!-- Enabled filter -->
                                <select id="instruments-enabled-filter" onchange="loadInstrumentsList()" class="filter-select" style="height: 28px; font-size: 0.75rem; border-radius: 4px; border: 1px solid var(--border-light); padding: 0 5px; background: transparent; color: var(--text-secondary); outline: none; cursor: pointer;">
                                    <option value="">上架状态 (All)</option>
                                    <option value="true">已上架 (Enabled)</option>
                                    <option value="false">未上架 (Disabled)</option>
                                </select>
                            </div>
                            
                            <!-- Pagination Controls Right -->
                            <div style="display: flex; gap: 6px; align-items: center; background: rgba(255, 255, 255, 0.05); padding: 2px 8px; border-radius: 6px; border: 1.5px solid var(--border-light);">
                                <select class="filter-select" id="instruments-size-select" onchange="changeAdminPageSize('instruments', this.value)" style="height: 24px; font-size: 0.7rem; border-radius: 4px; border: 1px solid var(--border-light); padding: 0 2px; width: 85px; background: transparent; color: var(--text-primary); font-weight: 600; cursor: pointer; outline: none; margin-right: 5px;">
                                    <option value="5">5 条/页</option>
                                    <option value="10" selected>10 条/页</option>
                                    <option value="20">20 条/页</option>
                                </select>
                                <button class="action-btn" onclick="changeAdminPage('instruments', -1)" style="background: var(--primary); color: #FFF; font-size: 0.72rem; padding: 3px 8px; border-radius: 4px; border: none; font-weight: 600; cursor: pointer; height: 24px;">上一页</button>
                                <span id="instruments-page-indicator" style="font-size: 0.72rem; font-weight: 600; color: var(--text-primary); margin: 0 4px; white-space: nowrap;">第 1 / 1 页 (共 0 条)</span>
                                <button class="action-btn" onclick="changeAdminPage('instruments', 1)" style="background: var(--primary); color: #FFF; font-size: 0.72rem; padding: 3px 8px; border-radius: 4px; border: none; font-weight: 600; cursor: pointer; height: 24px;">下一页</button>
                            </div>
                        </div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>商品 ID</th>
                                    <th>Symbol</th>
                                    <th>中文/英文名称</th>
                                    <th>资产类别</th>
                                    <th>基础资产 / 计价资产</th>
                                    <th>交易所 ID</th>
                                    <th>数据源</th>
                                    <th>已启用</th>
                                    <th>核心商品</th>
                                    <th>推荐商品</th>
                                    <th>操作选项</th>
                                </tr>
                            </thead>
                            <tbody id="instruments-table-body">
                                <!-- Loaded dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- SECTION: APP VERSIONS MANAGEMENT (APP 版本更新管理) -->
    <div class="drawer-overlay" id="instruments-overlay" onclick="closeInstrumentDrawer()"></div>
    <div class="drawer-sheet" id="instruments-drawer" style="width: 95%; max-width: 540px; overflow-y: auto;">
        <button class="drawer-close-btn" onclick="closeInstrumentDrawer()">✕</button>
        <div class="drawer-header-audit" style="margin-bottom: 24px; border-bottom: 1px solid #F1F5F9; padding-bottom: 16px;">
            <h2 id="instruments-drawer-title" style="font-size: 1.35rem; display: flex; align-items: center; gap: 8px; color: var(--text-primary);">📝 新建交易商品</h2>
            <p style="font-size: 0.78rem; color: #64748B; margin-top: 6px; font-weight: 500;">配置 MATP 交易终端可供交易的产品基础属性与开关设置</p>
        </div>
        
        <form id="instruments-form" onsubmit="saveInstrumentSubmit(event)" style="display: flex; flex-direction: column; gap: 15px;">
            <input type="hidden" id="edit-inst-id">
            
            <div class="form-grid-2">
                <div class="auth-input-group">
                    <label style="font-size: 0.8rem; color: var(--text-secondary); font-weight: 700; margin-bottom: 6px; display: block;">Symbol *</label>
                    <input type="text" id="edit-inst-symbol" required placeholder="如: btcusdt" style="width: 100%; height: 38px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border-light); background: #fff; text-transform: lowercase;">
                </div>
                <div class="auth-input-group">
                    <label style="font-size: 0.8rem; color: var(--text-secondary); font-weight: 700; margin-bottom: 6px; display: block;">商品名称 (Name) *</label>
                    <input type="text" id="edit-inst-name" required placeholder="如: Bitcoin" style="width: 100%; height: 38px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border-light); background: #fff;">
                </div>
            </div>
            
            <div class="form-grid-2">
                <div class="auth-input-group">
                    <label style="font-size: 0.8rem; color: var(--text-secondary); font-weight: 700; margin-bottom: 6px; display: block;">资产类别 (Asset Class) *</label>
                    <select id="edit-inst-assetClass" required style="width: 100%; height: 38px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border-light); background: #fff; color: var(--text-primary); font-weight: 600;">
                        <option value="CRYPTO">加密货币 (CRYPTO)</option>
                        <option value="FIAT">法币 (FIAT)</option>
                        <option value="STOCK">股票 (STOCK)</option>
                        <option value="FUTURES">期货 (FUTURES)</option>
                        <option value="COMMODITY">商品 (COMMODITY)</option>
                        <option value="OPTION">期权 (OPTION)</option>
                        <option value="FOREX">外汇 (FOREX)</option>
                        <option value="INDICES">指数 (INDICES)</option>
                    </select>
                </div>
                <div class="auth-input-group">
                    <label style="font-size: 0.8rem; color: var(--text-secondary); font-weight: 700; margin-bottom: 6px; display: block;">交易所 ID (Exchange ID) *</label>
                    <input type="number" id="edit-inst-exchangeId" required value="1" style="width: 100%; height: 38px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border-light); background: #fff;">
                </div>
            </div>
            
            <div class="form-grid-2">
                <div class="auth-input-group">
                    <label style="font-size: 0.8rem; color: var(--text-secondary); font-weight: 700; margin-bottom: 6px; display: block;">基础资产 ID (Base Asset ID) *</label>
                    <input type="number" id="edit-inst-baseAssetId" required style="width: 100%; height: 38px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border-light); background: #fff;">
                </div>
                <div class="auth-input-group">
                    <label style="font-size: 0.8rem; color: var(--text-secondary); font-weight: 700; margin-bottom: 6px; display: block;">计价资产 ID (Quote Asset ID) *</label>
                    <input type="number" id="edit-inst-quoteAssetId" required style="width: 100%; height: 38px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border-light); background: #fff;">
                </div>
            </div>
            
            <div class="auth-input-group">
                <label style="font-size: 0.8rem; color: var(--text-secondary); font-weight: 700; margin-bottom: 6px; display: block;">数据源 (Data Source)</label>
                <input type="text" id="edit-inst-dataSource" placeholder="如: binance" style="width: 100%; height: 38px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border-light); background: #fff;">
            </div>

            <div class="form-grid-2" style="margin-top: 10px;">
                <div class="auth-input-group">
                    <label style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; cursor: pointer; color: var(--text-primary); font-weight: 600;">
                        <input type="checkbox" id="edit-inst-enabled" checked style="width: 16px; height: 16px;"> 启用/上架当前商品
                    </label>
                </div>
                <div class="auth-input-group">
                    <label style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; cursor: pointer; color: var(--text-primary); font-weight: 600;">
                        <input type="checkbox" id="edit-inst-isCore" style="width: 16px; height: 16px;"> 标记为核心交易商品
                    </label>
                </div>
            </div>
            
            <div class="auth-input-group">
                <label style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; cursor: pointer; color: var(--text-primary); font-weight: 600;">
                    <input type="checkbox" id="edit-inst-recommended" style="width: 16px; height: 16px;"> 标记为推荐商品
                </label>
            </div>
            
            <div class="drawer-footer-actions" style="margin-top: 20px; display: flex; gap: 12px; border-top: 1.5px solid var(--border-light); padding-top: 20px;">
                <button type="button" class="action-btn" onclick="closeInstrumentDrawer()" style="flex: 1; padding: 10px; border-radius: 6px; border: 1px solid var(--border-light); background: #fff; color: var(--text-primary); cursor: pointer; font-weight: 600;">取消</button>
                <button type="submit" class="action-btn" style="flex: 1; padding: 10px; border-radius: 6px; border: none; background: var(--primary); color: #fff; cursor: pointer; font-weight: 600;">保存商品配置</button>
            </div>
        </form>
    </div>

    <!-- APP VERSIONS EDIT SLIDE DRAWER -->
