<div class="view-tab-content active" id="view-locales">
    <div class="glass-panel data-panel" style="padding: 18px;">
        <!-- Unified Filter Panel -->
        <div style="border-bottom: 1.5px solid var(--border-light); padding-bottom: 15px; margin-bottom: 15px;">
            <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap; justify-content: space-between;">
                <!-- Header, Add, Filter Left -->
                <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap; flex: 1;">
                    <div class="data-panel-title" style="font-size: 1.0rem; color: var(--primary); display: flex; align-items: center; gap: 6px; margin-right: 5px; font-weight: bold;">🌐 Locale 语言管理</div>
                    
                    <button class="action-btn btn-approve" onclick="openLocaleModal()" style="background: #5B51F9; color: #FFF; font-size: 0.72rem; padding: 4px 12px; border-radius: 4px; border: none; font-weight: 600; cursor: pointer; height: 28px;">+ 新增语言</button>
                    
                    <!-- Enabled Status Filter -->
                    <select id="locales-status-filter" onchange="window.adminPages.locales.current=1; loadLocalesList()" class="filter-select" style="height: 28px; font-size: 0.72rem; border-radius: 4px; border: 1px solid var(--border-light); padding: 0 5px; background: transparent; color: var(--text-secondary); outline: none; cursor: pointer; font-weight: 600;">
                        <option value="">所有状态 (All)</option>
                        <option value="true">仅已启用 (Enabled)</option>
                        <option value="false">仅已禁用 (Disabled)</option>
                    </select>
                </div>
                
                <!-- Pagination Controls Right -->
                <div style="display: flex; gap: 6px; align-items: center; background: rgba(255, 255, 255, 0.05); padding: 2px 8px; border-radius: 6px; border: 1.5px solid var(--border-light);">
                    <select class="filter-select" id="locales-size-select" onchange="changeAdminPageSize('locales', this.value)" style="height: 24px; font-size: 0.7rem; border-radius: 4px; border: 1px solid var(--border-light); padding: 0 2px; width: 85px; background: transparent; color: var(--text-primary); font-weight: 600; cursor: pointer; outline: none; margin-right: 5px;">
                        <option value="10">10 条/页</option>
                        <option value="20" selected>20 条/页</option>
                        <option value="50">50 条/页</option>
                    </select>
                    <button class="action-btn" onclick="changeAdminPage('locales', -1)" style="background: var(--primary); color: #FFF; font-size: 0.72rem; padding: 3px 8px; border-radius: 4px; border: none; font-weight: 600; cursor: pointer; height: 24px;">上一页</button>
                    <span id="locales-page-indicator" style="font-size: 0.72rem; font-weight: 600; color: var(--text-primary); margin: 0 4px; white-space: nowrap;">第 1 / 1 页 (共 0 条)</span>
                    <button class="action-btn" onclick="changeAdminPage('locales', 1)" style="background: var(--primary); color: #FFF; font-size: 0.72rem; padding: 3px 8px; border-radius: 4px; border: none; font-weight: 600; cursor: pointer; height: 24px;">下一页</button>
                </div>
            </div>
        </div>

        <!-- Table Grid -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 80px;">语言 ID</th>
                        <th style="width: 70px; text-align: center;">国旗图标</th>
                        <th>显示名称</th>
                        <th>语言代码</th>
                        <th>地区代码</th>
                        <th>书写系统</th>
                        <th>默认语言</th>
                        <th>启用状态</th>
                        <th>排序值</th>
                        <th>创建时间</th>
                        <th style="text-align: center; width: 260px;">操作选项</th>
                    </tr>
                </thead>
                <tbody id="locales-table-body">
                    <!-- Dynamically loaded -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Form Dialog -->
<div id="locale-form-modal" class="overlay" style="display: none; align-items: center; justify-content: center; z-index: 9999; backdrop-filter: blur(10px); background: rgba(0,0,0,0.55);">
    <div class="glass-panel" style="width: 90%; max-width: 480px; padding: 24px; border-radius: 12px; position: relative;">
        <button style="position: absolute; top: 12px; right: 12px; background: transparent; border: none; font-size: 1.2rem; color: var(--text-secondary); cursor: pointer;" onclick="closeLocaleModal()">✕</button>
        
        <h3 id="locale-modal-title" style="margin-top: 0; margin-bottom: 20px; color: var(--text-primary); display: flex; align-items: center; gap: 8px;">📝 新增语言配置</h3>
        
        <form id="locale-form" onsubmit="saveLocaleSubmit(event)" style="display: flex; flex-direction: column; gap: 12px;">
            <input type="hidden" id="locale-id">
            
            <div class="form-grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="auth-input-group">
                    <label style="font-weight: 700; font-size: 0.72rem; color: var(--primary); margin-bottom: 4px; display: block;">语言名称 (Name) *</label>
                    <input type="text" id="locale-name" required placeholder="例如：简体中文" style="width: 100%; height: 34px; border: 1.5px solid var(--border-light); border-radius: 6px; padding: 0 10px; font-size: 0.8rem; outline: none; background: var(--bg-screen); color: var(--text-primary);">
                </div>
                
                <div class="auth-input-group">
                    <label style="font-weight: 700; font-size: 0.72rem; color: var(--primary); margin-bottom: 4px; display: block;">语言代码 (LanguageCode) *</label>
                    <input type="text" id="locale-lang-code" required placeholder="例如：zh、en、hi" style="width: 100%; height: 34px; border: 1.5px solid var(--border-light); border-radius: 6px; padding: 0 10px; font-size: 0.8rem; outline: none; background: var(--bg-screen); color: var(--text-primary);">
                </div>
            </div>

            <div class="form-grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="auth-input-group">
                    <label style="font-weight: 700; font-size: 0.72rem; color: var(--primary); margin-bottom: 4px; display: block;">地区编码 (CountryCode)</label>
                    <input type="text" id="locale-country-code" placeholder="例如：CN、US、IN" style="width: 100%; height: 34px; border: 1.5px solid var(--border-light); border-radius: 6px; padding: 0 10px; font-size: 0.8rem; outline: none; background: var(--bg-screen); color: var(--text-primary);">
                </div>
                
                <div class="auth-input-group">
                    <label style="font-weight: 700; font-size: 0.72rem; color: var(--primary); margin-bottom: 4px; display: block;">书写系统 (ScriptCode)</label>
                    <input type="text" id="locale-script-code" placeholder="例如：Hans、Hant" style="width: 100%; height: 34px; border: 1.5px solid var(--border-light); border-radius: 6px; padding: 0 10px; font-size: 0.8rem; outline: none; background: var(--bg-screen); color: var(--text-primary);">
                </div>
            </div>

            <div class="auth-input-group">
                <label style="font-weight: 700; font-size: 0.72rem; color: var(--primary); margin-bottom: 4px; display: block;">国旗/图标链接 (Icon URL)</label>
                <input type="text" id="locale-icon" placeholder="https://example.com/locales/zh-CN.png" style="width: 100%; height: 34px; border: 1.5px solid var(--border-light); border-radius: 6px; padding: 0 10px; font-size: 0.8rem; outline: none; background: var(--bg-screen); color: var(--text-primary);">
            </div>

            <div class="form-grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="auth-input-group">
                    <label style="font-weight: 700; font-size: 0.72rem; color: var(--primary); margin-bottom: 4px; display: block;">排列顺序 (OrderIndex) *</label>
                    <input type="number" id="locale-order" required value="1" style="width: 100%; height: 34px; border: 1.5px solid var(--border-light); border-radius: 6px; padding: 0 10px; font-size: 0.8rem; outline: none; background: var(--bg-screen); color: var(--text-primary);">
                </div>
                <div class="auth-input-group" style="display: flex; flex-direction: column; justify-content: center; gap: 6px; padding-top: 10px;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="locale-is-default" style="width: 15px; height: 15px; cursor: pointer;">
                        <label for="locale-is-default" style="font-size: 0.75rem; color: var(--text-primary); cursor: pointer; font-weight: 600;">系统默认语言</label>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="locale-enabled" checked style="width: 15px; height: 15px; cursor: pointer;">
                        <label for="locale-enabled" style="font-size: 0.75rem; color: var(--text-primary); cursor: pointer; font-weight: 600;">立即启用 (Enabled)</label>
                    </div>
                </div>
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 15px; justify-content: flex-end;">
                <button type="button" class="action-btn" onclick="closeLocaleModal()" style="background: transparent; border: 1px solid var(--border-light); color: var(--text-secondary); padding: 8px 16px; border-radius: 6px; cursor: pointer;">取消</button>
                <button type="submit" class="action-btn btn-approve" id="locale-submit-btn" style="background: var(--primary); color: #FFF; border: none; padding: 8px 20px; border-radius: 6px; font-weight: 600; cursor: pointer;">保存</button>
            </div>
        </form>
    </div>
</div>
